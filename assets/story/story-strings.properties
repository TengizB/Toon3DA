# Every entry here is the LONG VERSION of a beat that already landed on an unskippable
# channel, so a player who never opens this screen misses no plot point.
# Paragraph breaks inside a body use || (the properties format is one line per id).
# --- Screen chrome (labels and setting values) ---
# =====================================================================
story.codex.title=ARCHIVE
story.codex.back=< BACK
story.codex.empty=Nothing recovered here yet.
story.codex.new=NEW
story.codex.complete=COMPLETE
story.codex.take=ORA's note
story.codex.setting.text=TEXT
story.codex.setting.reveal=REVEAL
story.codex.setting.motion=MOTION
story.codex.setting.audio=SOUND
