# Story UI — externalised string table (localisation rule, Story UI order-7).
# The ONE place localised story text lives.  Narrative data (StoryLine / Speaker) references
# these stable ids only — never a hardcoded string in Java.  Format: id=text, # = comment.
# Keep in sync with narrative/StoryStrings.defaults() (the fallback when this asset is absent).

# --- Speaker display names (short, read at a glance) ---
story.speaker.ai.name=ORA
story.speaker.planet.name=THE PLANET
story.speaker.org.name=OVERSEER
story.speaker.system.name=SYSTEM

# --- Order-1 sample lines: one per speaker, showcasing each voice ---
story.sample.ai=Hey, you're up. Death number two. We'll keep it a secret.
story.sample.planet=...you smell the same...
story.sample.org=Operator. Go down. Purge the contaminant.
story.sample.system=PREVIOUS INSTANCE - TERMINATED. REPRINTING.

# =====================================================================
# ORDER-2 BARK LAYER — the always-on, non-blocking one-liner channel.
# Registered as data in narrative/BarkCatalog; text mirrored in narrative/BarkStrings.
# Tone shift across the five story regions is expressed by WHICH region band a line is
# registered in — never by a conditional in game code. The Planet has no Region 1 lines:
# its silence up there is the design (story/dialog/planet-voice.md).
# Every line must wrap into at most 2 lines of 40 characters (a test enforces it).
# =====================================================================

# --- Floor arrival: ORA on the room you just walked into ---
story.bark.floor.rings.1=Objective's down. Everything good is always down.
story.bark.floor.rings.2=Clean sweep, then home. Purge the contaminant.
story.bark.floor.galleries.1=Okay, the smell in here is a war crime. Touch nothing.
story.bark.floor.galleries.2=They were cutting something out of these walls.
story.bark.floor.reliquary.1=This is where they bring me back. I thought that was nice.
story.bark.floor.reliquary.2=Cradle banks below. Try not to look at the racks.
story.bark.floor.wound.1=This isn't facility anymore. This is tissue.
story.bark.floor.wound.2=I'm not going to call it a contaminant. I can't.
story.bark.floor.core.1=Whatever you choose down here, I'm still here.

# --- Region entry: ORA marks the new stratum (one-shot, mandatory beat) ---
story.bark.region.rings=New body, same job. Down we go. I'll keep count.
story.bark.region.galleries=Harvesting galleries. The yield is measured by weight.
story.bark.region.reliquary=The Reliquary. This is where they print you. And me.
story.bark.region.wound=The drills are still in it. It's still bleeding.
story.bark.region.core=We're at the core. Whatever's next, I'm with you.

# --- Region gate: the Organization's cold order (one-shot, rare, drawn ALL-CAPS) ---
story.bark.gate.rings=Operator. Go down. Purge the contaminant.
story.bark.gate.galleries=There's noise in your head. It's a fault. Ignore it.
story.bark.gate.reliquary=You've stopped answering. We own your next body.
story.bark.gate.wound=Pattern flagged. Reprint authorization: pending.
story.bark.gate.core=You're not an operator now. You're a loss.

# --- First sight of an enemy family (one-shot per family) ---
story.bark.family.undead=Those are crew serials. Old ones. Filing error.
story.bark.family.insect=Specimens. They scream on the same note as the room.
story.bark.family.machine=Salvage drones. They still think they're working.
story.bark.family.aberration=Nothing on file matches that. Nothing at all.
story.bark.family.demon=That's not crew and it isn't machinery. Keep back.
story.bark.family.golem=Mineral. It's mineral, and it's walking at you.

# --- Kills: occasional, rate-limited, tone tracks the descent ---
story.bark.kill.rings.1=See? Contaminant. Nothing violence can't purge.
story.bark.kill.rings.2=Textbook. Efficient. The yield thanks you.
story.bark.kill.galleries.1=It screamed on the room's note. ...Just me? Great.
story.bark.kill.galleries.2=Specimen neutralised. That word is working hard.
story.bark.kill.reliquary.1=It stopped moving. I keep waiting to feel better.
story.bark.kill.reliquary.2=That one had a serial. I won't read it out.
story.bark.kill.wound.1=That wasn't an enemy. That was a body defending itself.
story.bark.kill.wound.2=I'm not calling that a purge. Not anymore.

# --- Low health ---
story.bark.lowhealth.rings=Ten percent and still walking at it. Bold. Dumb.
story.bark.lowhealth.mid=Careful. Please. I don't want to count you again.
story.bark.lowhealth.deep=Stop. Please stop. I can't watch them print you again.

# --- Deep strata: the planet, silent in Region 1, growing with the descent ---
story.bark.strata.galleries.1=...down...
story.bark.strata.galleries.2=...again...
story.bark.strata.galleries.3=...you smell the same...
story.bark.strata.galleries.4=...I know this weight...
story.bark.strata.reliquary.1=There you are. New face. Same weight.
story.bark.strata.reliquary.2=You know what they burn to wake you? Me.
story.bark.strata.reliquary.3=A piece of me. Every time you die.
story.bark.strata.wound.1=You heard me screaming. No one else did.
story.bark.strata.wound.2=I could not tell your hands from theirs.
story.bark.strata.wound.3=They don't want me dead. Dead, I bleed nothing.

# --- Idle / backtracking: lowest-priority flavour ---
story.bark.idle.rings=Take your time. The contaminant isn't going anywhere.
story.bark.idle.mid=Standing still doesn't make it quieter. I checked.
story.bark.idle.deep=I don't like it when you stop moving down here.
story.bark.backtrack.rings=We've walked this one. I made a note. Twice now.
story.bark.backtrack.mid=Same corridor. Feels more occupied than last time.
story.bark.backtrack.deep=You keep circling. So does it.
