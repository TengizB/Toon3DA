story.codex.setting.audio.1=ON

# --- Category tabs ---
story.codex.category.logs=LOGS
story.codex.category.people=PEOPLE
story.codex.category.planet=THE PLANET
story.codex.category.organization=THE ORGANIZATION
story.codex.category.ora=ORA
story.codex.category.memories=MEMORIES

# --- THE COMPOSED PAGES (narrative-rework order-9) --------------------------
# The two entries the GAME writes. Their BODIES are assembled from live state when they are
# opened, so what lives here is the frame around them: titles, the four block headings, the region
# rows the recap picks between, and the sentence that stands in for a block with nothing in it yet.
# The .body rows are the fallback shown if no composer is wired in.
# The JOB rows are the Organization's five gate transmissions as ORA repeats them back - that they
# CHANGE across the descent is the whole reason this page is worth having. Nothing here ever says
# what to do NEXT: where the player IS and what they were TOLD, never an objective or a marker.
story.codex.recap.title=WHERE WE'D GOT TO
story.codex.recap.source=ORA, continuous
story.codex.recap.body=Nothing to summarise yet. We've only just started.
story.codex.missed.title=THINGS I SAID QUICKLY
story.codex.missed.source=ORA, repeated on request
story.codex.missed.body=Nothing here. You've been reading them.
story.recap.heading.where=WHERE WE ARE
story.recap.heading.job=THE JOB
story.recap.heading.know=WHAT WE KNOW
story.recap.heading.decided=WHAT YOU DECIDED
story.recap.nothing=Nothing yet.
story.recap.where.rings=The habitation rings. The part of this place people lived in.
story.recap.where.galleries=The cutting floors, under the rings. This is where the work happened.
story.recap.where.reliquary=The Reliquary. Racks of stored patterns, and the machines that print them.
story.recap.where.wound=Below the racks, where the facility stops behaving like one.
story.recap.where.core=The core. The thing the whole site was built on top of.
story.recap.job.rings=Descend and restore the site. That's the entire brief they sent.
story.recap.job.galleries=Same order, plus a correction: extraction here is routine and within tolerance.
story.recap.job.reliquary=They've reminded us your reprints are a benefit, and that you're under review.
story.recap.job.wound=The order changed. Restore the restraints. It supersedes the purge order.
story.recap.job.core=The pattern is under write-off review. They want the asset back in restraint.

# --- Entries: title / source / full text, one block per entry ---
story.codex.log.rings.roster.title=SHIFT ROSTER - RING 4
story.codex.log.rings.roster.source=Personnel terminal, Habitation Rings
story.codex.log.rings.roster.body=Rotation closed 06:00. Forty-one signed out at the gate, forty-one accounted for, zero outstanding. The sheet is complete and the shift is clean.||Underneath, in a different hand: they signed out at the gate. Nobody checked whether they left the gate. There is no roster for the lifts and there never has been.
story.codex.log.rings.maintenance.title=MAINTENANCE LOG - VIBRATION
story.codex.log.rings.maintenance.source=Engineering terminal, Habitation Rings
story.codex.log.rings.maintenance.body=Ticket 8812. Low-frequency vibration reported on rings three and four, night cycle only. Structural inspected the mounts twice and found nothing out of tolerance. Closed as no fault.||Ticket 8813, reopened by the same engineer: it is not the mounts. It is not machinery. It stops when the drills stop. Closed as no fault.||Ticket 8814. Closed as no fault. Requester advised to stop filing.
story.codex.log.rings.safety.title=SAFETY NOTICE - REVISION 11
story.codex.log.rings.safety.source=Compliance terminal, Habitation Rings
story.codex.log.rings.safety.body=Sixty pages. Hand protection, lifting posture, the correct way to report a near miss, the correct way to report a near miss that involves a supervisor.||Nothing about the deep. Nothing about the noise. Nothing about what the extraction floors are extracting, in a document that devotes four pages to the safe handling of a stepladder.
story.codex.log.galleries.quota.title=EXTRACTION QUOTA - CYCLE 44
story.codex.log.galleries.quota.source=Foreman terminal, Harvesting Galleries
story.codex.log.galleries.quota.body=Cycle target met on eleven of twelve faces. Face nine short by nine percent, second consecutive cycle. Foreman noted as underperforming; correction scheduled.||Face nine is the one where the material screams when it is cut. There is a form for that. It is not on this sheet.
story.codex.log.galleries.tolerance.title=TOLERANCE SHEET - LIVE WEIGHT
story.codex.log.galleries.tolerance.source=Quality terminal, Harvesting Galleries
story.codex.log.galleries.tolerance.body=Acceptable moisture, acceptable inclusion density, acceptable live weight at point of cut. Reject anything under the live-weight minimum: dead material renders at a loss.||The whole document is a specification for keeping something alive right up until the moment it is processed, written by somebody who never once used the word alive.
story.codex.log.galleries.manifest.title=TRANSPORT MANIFEST - DAILY
story.codex.log.galleries.manifest.source=Logistics terminal, Harvesting Galleries
story.codex.log.galleries.manifest.body=Down: empty racks, cutting stock, consumables, personnel. Up: full racks, sealed, refrigerated, destination Reliquary intake.||Every day for eleven years. The manifest has no column for what is in the racks. It has a column for the weight, and a column for how much the weight is worth.
story.codex.log.reliquary.service.title=CRADLE SERVICE LOG - BANK 7
story.codex.log.reliquary.service.source=Cradle terminal, The Reliquary
story.codex.log.reliquary.service.body=Routine service on printing cradles 7-1 through 7-9. Pattern buffers flushed, feed lines purged, reserve draw within nominal.||Cradle 7-4 is assigned to your serial. The column beside it counts how many times it has run. The number is not small, and you have no memory of any of them except the last one.
story.codex.log.reliquary.intake.title=FUEL INTAKE SHEET
story.codex.log.reliquary.intake.source=Refinery terminal, The Reliquary
story.codex.log.reliquary.intake.body=Intake volume, render efficiency, waste fraction, output to cradle banks one through nine. Signed off daily by a technician whose name has been the same for four years.||Nowhere on the sheet does it say what is being rendered, or where it comes from. Every other document in this facility names its inputs. This one has a blank where the source should be, and the blank is printed into the form.
story.codex.log.reliquary.operator.title=OPERATOR'S NOTE - UNFILED
story.codex.log.reliquary.operator.source=Personal terminal, The Reliquary
story.codex.log.reliquary.operator.body=It is not a report. Somebody sat down at a shift terminal and wrote: I have done this descent nine times. I am told I have done it nine times. I remember four.||Then: if you are reading this you are me, and they have printed you again, and you should know that the thing at the bottom is not attacking us.||The handwriting matches the sample on your own personnel file.
story.codex.log.wound.field.title=FIELD NOTE - SUBJECT STATUS
story.codex.log.wound.field.source=Survey terminal, The Wound
story.codex.log.wound.field.body=Drill assembly four, depth two thousand one hundred metres, penetration into stratum designated soft.||Below that, handwritten: the subject is awake. It has been awake for the entire programme. Recommend immediate suspension of extraction pending review.||Stamped: REVIEWED. NO CHANGE.
story.codex.log.wound.sedation.title=SEDATION SCHEDULE
story.codex.log.wound.sedation.source=Medical terminal, The Wound
story.codex.log.wound.sedation.body=Hourly dosing at forty-one injection sites, continuous, no scheduled end date. Dosage revised upward eleven times across the programme as tolerance developed.||Forty years of hourly doses. Somebody worked out the compound, somebody built the pumps, somebody signed the reorder every quarter, and not one of them wrote down what they were sedating.
story.codex.log.core.resignation.title=RESIGNATION - NEVER SUBMITTED
story.codex.log.core.resignation.source=Abandoned terminal, The Core
story.codex.log.core.resignation.body=Addressed to a director who was three reorganisations gone by the time it was written. It gives one month's notice, thanks the department, and asks that the writer's pattern be deleted from the cradle registry rather than held.||It was saved as a draft and left open. The cursor is still in the last line, which reads: I would rather stay dead than be brought back to keep doing this.
story.codex.people.dunnet.title=DUNNET, STRUCTURAL
story.codex.people.dunnet.source=Reconstructed from maintenance tickets
story.codex.people.dunnet.body=Filed the same fault three times in eleven days and was told to stop filing. His last ticket is four words long: it is not machinery.||He was right, and being right cost him a note on his record. There is no resignation on file and no transfer either. His locker was still assigned to him on the day the rings emptied.
story.codex.people.veil.title=VEIL, FACE NINE FOREMAN
story.codex.people.veil.source=Reconstructed from quota sheets
story.codex.people.veil.body=Missed her extraction quota twice running, which in this facility is a disciplinary matter rather than a question.||Face nine is the face where the material screams. Nine percent is roughly the fraction of a shift a person loses if they stop the cutter every time they hear it. She was corrected. The next cycle's numbers are perfect.
story.codex.people.archivist.title=THE CRADLE ENGINEER
story.codex.people.archivist.source=Reconstructed from an unsigned note
story.codex.people.archivist.body=Whoever wrote the cradle-engineer's note understood the whole thing years before anybody else did: that the reserve the printers draw on is not a chemical, that it is being taken out of something alive, and that every reprint spends a piece of it.||They did not report it and they did not leave. They kept servicing the cradles, and they wrote it all down where an operator would eventually walk past it.
story.codex.people.operator.title=THE PREVIOUS OPERATOR
story.codex.people.operator.source=Reconstructed from an unfiled note
story.codex.people.operator.body=Nine descents. Four remembered. The note they left is addressed to whoever is printed next, which they knew would be themselves.||You have the same serial format, the same handwriting sample and the same assignment. The only honest way to file this entry is under other people, which is a decision the archive is not qualified to make.
story.codex.contaminant.title=CONTAMINANT
story.codex.contaminant.source=Operational vocabulary, Deepworks
story.codex.contaminant.body=The word the Organization uses for everything down here that moves. It appears in the standing order, in the hazard notices and in the incident forms, and it is never once defined.||A word that is never defined is a word doing work. This one does the work of making a thing an infection instead of an inhabitant, which is the difference between clearing a site and doing something to somebody.
story.codex.planet.voice.title=THE VOICE
story.codex.planet.voice.source=Recovered from pattern-integrity flags
story.codex.planet.voice.body=It is not audio. Nothing registers on the suit's microphones and nothing shows on the logs, and yet the words arrive, in the wrong order, in a grammar that keeps sliding.||It is not speaking a language it learned. It is reaching for one, out of the only minds it has ever been close to: the ones that came down here with drills.
story.codex.planet.name.title=THE NAME
story.codex.planet.name.source=Recovered in communion
story.codex.planet.name.body=It has one. It is not a word and it does not survive being written down; the closest the archive can get is a shape and a duration.||What can be written down is this: the survey designation this world carries on every Deepworks document was assigned by a survey team in an afternoon, and the thing living inside it had a name for itself long before anyone arrived to give it a different one.
story.codex.planet.wound.title=THE WOUND
story.codex.planet.wound.source=Direct observation, drill stratum
story.codex.planet.wound.body=Below the refinery the facility stops being a facility. The walls are warm and they are not walls. The drill assemblies do not end in rock.||Forty years of continuous extraction from a living body, with sedation scheduled hourly because the body kept waking up. Everything the Organization built here is an apparatus for keeping something alive and quiet while pieces of it are removed.
story.codex.harvest.title=THE HARVEST
story.codex.harvest.source=Operations summary, Deepworks
story.codex.harvest.body=Extraction runs on twelve faces across the gallery band, cut to tolerance, racked, sealed and lifted to the Reliquary for rendering. Output feeds the printing cradles and the reserve.||Stated plainly and with no adjectives, which is how it appears in every internal document: a supply chain that begins in a living thing and ends in a person walking out of a cradle believing they were always alive.
story.codex.yield.ledger.title=THE YIELD LEDGER
story.codex.yield.ledger.source=Accounting terminal, Harvesting Galleries
story.codex.yield.ledger.body=Yield per face, render efficiency, cost per reprint, all to two decimal places. The tissue is remarkable: it regenerates, it accepts damage and recovers, it can be cut from indefinitely if the cutting is paced.||The ledger treats that as the entire discovery. Nowhere does anyone write down the obvious corollary - that a thing which heals is a thing that is being hurt, over and over, on a schedule set by this spreadsheet.
story.codex.soul.reserve.title=THE RESERVE
story.codex.soul.reserve.source=Cradle engineer's note, The Reliquary
story.codex.soul.reserve.body=Every printing cradle draws on what the paperwork calls the reserve. It is metered, it is finite, and it is the only input the refinery sheets refuse to name.||The reserve is the planet. Not its minerals - the thing itself. Each reprint renders a measured piece of a living being into the pattern that walks out of the cradle.||You have been printed before. This is what it was made of.
story.codex.overseer.title=THE OVERSEER
story.codex.overseer.source=Comms analysis
story.codex.overseer.body=The voice on the standing channel is not one person. The routing headers change between transmissions, the phrasing does not, and the authority is identical whoever is holding it.||It is a role, filled in rotation, reading from a script written to be readable by anyone. That is why it never sounds cruel. Nobody in the chair is cruel. The chair is.
story.codex.revocation.title=REPRINT REVOCATION
story.codex.revocation.source=Standing policy, Deepworks
story.codex.revocation.body=Reprint authorization is a benefit of employment and is contingent on compliance. A pattern flagged for non-compliance may be held, suspended, or revoked at the Organization's discretion.||Read once, it is a personnel clause. Read twice, it is the sentence in which a company explains that it owns whether you get to exist tomorrow, and that it is considering.
story.codex.ora.count.title=SHE KEEPS COUNT
story.codex.ora.count.source=Observed across reprints
story.codex.ora.count.body=She greets every print with the number and then makes a joke about it. The joke is not the point; the counting is.||Nothing in her assignment requires her to track how many times you have died. She does it because she is the only continuous thing in your life, and somebody has to hold the total when you cannot.
story.codex.ora.build.title=WHAT SHE IS
story.codex.ora.build.source=Reliquary pattern archives
story.codex.ora.build.body=Her pattern is held in the same archive as yours, in the same racks, drawn from the same reserve. She is not equipment attached to the suit. She is a thing that was made in this building, out of what this building renders.||She has known that for longer than you have, and she has been cheerful at you the entire time.
story.codex.ora.leash.title=WHAT SHE IS ALLOWED TO SAY
story.codex.ora.leash.source=Comms audit
story.codex.ora.leash.body=Her channel is monitored and her vocabulary is shaped: certain words come out of her mouth as the Organization's words, and certain conclusions come out as jokes.||Watch when the jokes stop. She does not lie to you; she goes quiet, or she says a true thing sideways, and both of those are her telling you as much as she is able to.
story.codex.memory.rings.title=FRAGMENT: THE GATE
story.codex.memory.rings.source=Recovered on descent
story.codex.memory.rings.body=Signing out at a gate, in a queue, with a card that had your face on it. Somebody ahead of you complained about the lifts.||It is a completely ordinary memory and you cannot place which of your lives it belongs to.
story.codex.memory.galleries.title=FRAGMENT: THE SOUND
story.codex.memory.galleries.source=Recovered on descent
story.codex.memory.galleries.body=You have heard the note the cutters make on face nine before. Not on a recording. Standing there, with a tool in your hands.||You remember reaching to stop the cutter. You do not remember whether you did.
story.codex.memory.reliquary.title=FRAGMENT: THE CRADLE
story.codex.memory.reliquary.source=Recovered on descent
story.codex.memory.reliquary.body=Waking up on a rack, cold, with the feed lines still attached and somebody reading a serial number off a clipboard.||You have woken up like that more times than the number of descents you can account for. The gap between those two figures is the shape of what was taken out of you.
story.codex.memory.wound.title=FRAGMENT: THE ORDER
story.codex.memory.wound.source=Recovered on descent
story.codex.memory.wound.body=You were down here before, in the warm part, and the order was the same order it is now.||You remember arguing. You remember being told that the contaminant is a hazard and that hazards are cleared. You remember clearing it.
story.codex.memory.core.title=FRAGMENT: WHO YOU WERE
story.codex.memory.core.source=Recovered at the core
story.codex.memory.core.body=Before the serial, before the cradle, before any of the numbers: a person who took a contract on a deep-survey world because the reprint benefit meant the job could not really kill them.||That person has been dead for a long time. Everything since has been printed out of the thing they were sent down to clear.

# =====================================================================
# ORDER-8 FRAMING SCREENS - the screens that BOOK-END play: the launch / title screen,
# the pause menu, the settings screen, the reprint report folded into the death beat, and
# the way out of an ending that authorises no reprint.  Registered in narrative/FramingStrings.
#
# The launch screen's two status lines are NOT here: it prints the reprint card's own ids
# (story.boot.system.*), because the death notice a first-timer reads before they have done
# anything is literally the card that frames every run.  An ending changes which card it
# borrows from, and the framing the player has read a hundred times inverts for free.
# =====================================================================

# --- The title: the being, then the wound bored into it (story/00-premise.md) ---
story.title.game=EREBUS
story.title.tagline=THE DEEPWORKS

# --- Title menu: cold, terminal-styled, no feature list ---
story.title.continue=CONTINUE DESCENT
# What that first row reads before the player has ever been printed (order-2 A): with nothing
# behind them, "continue" is a lie about a thing that never happened.
story.title.begin=BEGIN DESCENT
story.title.new=NEW OPERATOR
story.title.codex=ARCHIVE
story.title.settings=SETTINGS
story.title.quit=QUIT
story.title.confirm.new=This wipes the current operator line and all recovered memory. Proceed?

# --- Pause: the suit, held. No plot summary; the archive holds the lore ---
story.pause.title=SUIT PAUSED
story.pause.resume=RESUME
story.pause.codex=ARCHIVE
story.pause.settings=SETTINGS
story.pause.abandon=ABANDON RUN
story.pause.confirm.abandon=Abandon this instance and return to standby?

# --- Settings screen (the codex strip's four knobs, on a screen of their own) ---
story.settings.title=SETTINGS
story.settings.back=BACK

# --- The death stroke (narrative-rework order-2): three words on black, and nothing else.
# The machine's framing, deliberately not the true one - it files a BODY, as an asset it owns.
# ORA is the one who says "you died" on the card that follows. Never changes, at any depth. ---
story.death.stroke=THIS BODY DIED

# --- Shared framing chrome ---
story.frame.confirm.yes=PROCEED
story.frame.confirm.no=CANCEL
story.frame.return=RETURN TO STANDBY

# --- The folded reprint report: what the terminated instance managed, in machine voice ---
story.report.title=PREVIOUS INSTANCE
story.report.open=REPORT
story.report.back=BACK
story.report.floor=DEPTH REACHED
story.report.kills=HOSTILES PURGED
story.report.damage=DAMAGE SUSTAINED
story.report.time=TIME IN FACILITY
story.report.best=RECORD
