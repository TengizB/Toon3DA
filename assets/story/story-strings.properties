# Story UI - externalised string table (localisation rule, Story UI order-7).
# The ONE place localised story text lives.  Narrative data (StoryLine / Speaker) references
# these stable ids only - never a hardcoded string in Java.  Format: id=text, # = comment.
# Keep in sync with narrative/StoryStrings.defaults() (the fallback when this asset is absent).

# --- Speaker display names (short, read at a glance) ---
story.speaker.ai.name=ORA
story.speaker.planet.name=THE PLANET
story.speaker.org.name=OVERSEER
story.speaker.system.name=SYSTEM

# The four order-1 SAMPLE lines are deliberately absent (narrative-rework order-6 B): they were a
# dev showcase fixture shipping in the player-facing table.  Their text now lives with the data that
# uses them, narrative/StorySampleLines, which the showcase and the foundation test fold in by hand.

# =====================================================================
# ORDER-2 BARK LAYER - the always-on, non-blocking one-liner channel.
# Registered as data in narrative/BarkCatalog; text mirrored in narrative/BarkStrings.
# Tone shift across the five story regions is expressed by WHICH region band a line is
# registered in - never by a conditional in game code. The Planet has no Region 1 lines:
# its silence up there is the design (story/dialog/planet-voice.md).
# Most lines are LORE (they tell the player something); a minority are ORA's dry asides,
# and the lore/levity mix is weighted in StoryUiConstants - see narrative/BarkTone.
# Every line must wrap into at most 2 lines of 40 characters (a test enforces it).
# =====================================================================

# --- NARRATIVE-REWORK ORDER-2 D: ORA'S INTRODUCTION. One row per narrative/IntroBeat, all
# one-shot and STORY_CRITICAL. Three land on run 1 (who is talking, what happened to you, why
# your memory came back short), two on run 2 (she is not printed, so she is the only one who
# remembers your last body), and the last four hang off a door, a pickup, the first quiet
# stretch and the first terminal — she is met being useful, never delivering a biography. ---
story.bark.intro.greeting=That's you awake. I'm ORA - the assistant in your suit.
story.bark.intro.what_happened=You died about an hour ago. They keep a copy. This is the new you.
story.bark.intro.the_gap=Your memory came back short. Normal. I'll fill in the gaps as we go.
story.bark.intro.continuity=Back already. I don't get printed, by the way - I just reload.
story.bark.intro.memory=Which makes me the only one here who remembers your last one.
story.bark.intro.loop_restart=They rebuild the stored you, not the one that fell. It starts at the top.
story.bark.intro.loop_refill=The works don't stay cleared either. Whatever's down there refills them.
story.bark.intro.doors=I can do doors and locks. Guns are your department.
story.bark.intro.carried_items=Anything you carry is yours until you die. Then it stays here and you don't.
story.bark.intro.reprint_counter=That number on the wake card is which print you are. I keep the count.
story.bark.intro.paperwork=I read the paperwork so you don't have to. Roster: forty-one out, nobody back.

# --- NARRATIVE-REWORK ORDER-3: THE VOCABULARY LADDER. One naming line per narrative/StoryTerm,
# and the only place a proper noun of this fiction may arrive for the first time. Each performs
# the NAMED step - the word attached to the plain description the player already has, at a moment
# they can see the thing being named. ONE new word per line, and never a word for a thing they
# cannot see yet. Every row is one-shot and STORY_CRITICAL; a definition the player never reads
# leaves them holding the word for the rest of the game. Region 1 gets eight of them; everything
# below arrives with the region that makes it mean something. ---
story.term.reprint=The paperwork calls that a reprint. You're on your second.
story.term.deepworks=This is the Deepworks. Forty years of digging, straight down.
story.term.erebus=The rock it's dug into is Erebus. Survey named it in an afternoon.
story.term.contaminant=They call it the contaminant. That's the word on the form, not a description.
story.term.overseer=The voice on that channel is the Overseer. It's a desk, not a person.
story.term.instance=They file each of you as an instance. That's what the number is.
story.term.serial=Crew wear serials. So do you - check your cuff sometime.
story.term.checkpoint=A checkpoint is the last stored read of you. They build from that.
story.term.yield=Yield is whatever these floors were cutting out and sending up.
story.term.reserve=The reserve is the fuel. Metered, finite, and nobody says of what.
story.term.cradle=The machines in the racks are Cradles. A body comes out of one.
story.term.pattern=Your pattern is the stored you. The data. Not this body.
story.term.wound=Nobody calls this part anything. The old notes say the Wound.

# --- ORDER-5 TUTORIAL THROUGH ORA: the whole tutorial, one line per control, taught the
# first time that control is actually useful. One-shot for the life of the save. ---
story.bark.control.move=Tap forward to step. Everything good is down.
story.bark.control.fire=It's awake. Fire button, bottom right. Go on.
story.bark.control.reload=You're dry. Reload before it notices, ideally.
story.bark.control.heal=You're carrying a medkit. Heal. Now would be good.
story.bark.control.switch_weapon=Two guns now. Switch weapon cycles them.
story.bark.control.inventory=Open the bag when you get a second. It fills up.

# --- ORDER-5 LOG TAKES: ORA's one line about the terminal the player just walked up to.
# The facility's paperwork, for the player who will never open a codex. The 'yield' and
# 'cradle' rows are the mandatory reveal beats of their regions (one-shot, critical). ---
story.bark.log.rings.1=Shift notes. Someone's handwriting stops mid-word.
story.bark.log.rings.2=Maintenance log. Complaints about noise below.
story.bark.log.rings.3=A lunch order, dated the last day. Nobody came to collect it.
story.bark.log.rings.4=Sixty pages of safety notices. Four on ladders. None on the deep levels.
story.bark.log.galleries.1=Extraction quotas. Someone missed theirs. Twice.
story.bark.log.galleries.2=Tolerance sheet. It lists 'live weight'. Live.
story.bark.log.galleries.4=Transport manifest. Down empty, up full. Daily.
story.bark.log.galleries.5=Floor plan. Every gallery slopes to a drain. Every one.
story.bark.log.galleries.yield=Yield report. They're mining something that heals.
story.bark.log.reliquary.1=Cradle service log. Your name is in the column.
story.bark.log.reliquary.2=Pattern integrity report. Mine's flagged. Lovely.
story.bark.log.reliquary.3=Fuel intake sheet. Nobody wrote where it's from.
story.bark.log.reliquary.4=An operator's note. The handwriting is yours.
story.bark.log.reliquary.cradle=The 'reserve' is the planet. They burn it to make you.
story.bark.log.wound.1=Drill maintenance. Depth in metres. Into what.
story.bark.log.wound.2=A field note. It says 'the subject is awake'.
story.bark.log.wound.3=Someone stopped writing halfway through a word.
story.bark.log.wound.4=Sedation schedule. Hourly. For forty years.
story.bark.log.wound.5=Reorder form. Same compound, eleven times stronger.
story.bark.log.core.1=Nothing is filed down here. Only its memory.
story.bark.log.core.2=The last log is a resignation. Never submitted.
story.bark.log.core.3=Someone wrote 'I'm sorry' and left it running.
story.bark.log.core.4=A checklist for re-chaining. Step one is you.

# --- Floor arrival: ORA reads the room you just walked into ---
story.bark.floor.rings.1=Objective's down. Everything good is always down.
story.bark.floor.rings.2=Evacuation notices, still fresh. They left mid-shift.
story.bark.floor.rings.3=Crew bunks. Tags still in the racks - same kind of tag you're wearing.
story.bark.floor.rings.4=Clear it, restart the works, go home. That's the whole brief.
story.bark.floor.galleries.1=The air reads wrong in here. Organic, and a lot of it. Touch nothing.
story.bark.floor.galleries.2=They were cutting something out of these walls. By weight.
story.bark.floor.galleries.3=Extraction tolerances on the door. This was a factory.
story.bark.floor.galleries.4=The specimens never got in here. They were grown in here.
story.bark.floor.galleries.5=Four safety notices. None of them mention the screaming.
story.bark.floor.reliquary.1=This is where they bring me back. I thought that was nice.
story.bark.floor.reliquary.2=Cradle banks below. Try not to look at the racks.
story.bark.floor.reliquary.3=Pattern archives. Your file is in here. Mine is too.
story.bark.floor.reliquary.4=This is a refinery. They render the reserve into fuel.
story.bark.floor.reliquary.5=I'd make a joke here. I've got nothing. Give me a minute.
story.bark.floor.wound.1=This isn't facility anymore. This is tissue.
story.bark.floor.wound.2=I'm not going to call it a contaminant. I can't.
story.bark.floor.wound.3=The drills are still in it. They never stopped drilling.
story.bark.floor.wound.4=It's warm in here. That isn't machinery. That's a body.
story.bark.floor.core.1=Whatever you choose down here, I'm still here.
story.bark.floor.core.2=No more layers after this one. Just it, and us.

# --- Region entry (one-shot mandatory beat) ---
story.bark.region.rings=Habitation rings. People lived up here. The job's below them.
story.bark.region.galleries=Harvesting galleries. This is where the cutting happened.
story.bark.region.reliquary=The Reliquary. This is where they print you. And me.
story.bark.region.wound=The drills are still in it. It's still bleeding.
story.bark.region.core=We're at the core. Whatever's next, I'm with you.

# --- Region gate: the Organization's cold order (one-shot, drawn ALL-CAPS).
# THE ORGANIZATION, REWORKED (narrative-rework order-7): five transmissions, each with a JOB in it
# and each making a claim about the WORLD that an object somewhere in the build disproves. The
# pairings are the LIE LEDGER in docs/story-ui-system.txt. Nothing here is cruel, nothing here
# answers a question about itself, and nothing here is corrected on screen by narration ---
story.bark.gate.rings=Operator. Ten weeks of silence. The crew are dead. Descend and restore the site.
story.bark.gate.galleries=Operator. Gallery extraction is routine and within tolerance.
story.bark.gate.reliquary=Operator. Reprint authorization is a benefit. Compliance is under review.
story.bark.gate.wound=Operator. Restore the restraints. This supersedes the purge order.
story.bark.gate.core=Operator. Pattern under write-off review. Return the asset to restraint.

# --- ORA's asides at the gate (one-shot): she reports what is in front of her and never explains
# what it means. Two only - she comments when the paperwork has something to point at ---
story.bark.gate.rings.ora=That's the whole brief. Ten weeks and one paragraph.
story.bark.gate.wound.ora=New order, same reference number. I kept the old one.

# --- THE OVERSEER IS A DESK (order-7 C): the evidence, volunteered from the Reliquary down. The
# mechanism is the reply to the Core order's probe, for a player who asks ---
story.bark.org.desk=I checked. Six different people have said the same paragraph to you.

# --- THE BESTIARY VOICE (narrative-rework order-5) ---
# First sight of an enemy FAMILY (one-shot per family): name it, then say how it kills you.
story.bark.family.undead=Crew serials on those. They're slow - back up and let it walk into your shot.
story.bark.family.insect=Grown here, out of the walls. They come in numbers - don't get surrounded.
story.bark.family.machine=Site security, still on shift. Armoured from the front - make it turn.
story.bark.family.aberration=Nothing on file matches that. It's slow and it hits hard - stay at range.
story.bark.family.demon=Not crew, not machinery. It's fast - don't let it reach you first.
story.bark.family.golem=Mineral, and moving. The walls are standing up - and they turn slowly.

# The same families, met from the Wound down: the reframe, no tactics. What they actually were.
story.bark.family.undead.deep=That was crew. The conditions here killed them, not the thing below us.
story.bark.family.insect.deep=Those were grown out of this place, to be cut up. We made them.
story.bark.family.machine.deep=That one is ours. Company security, still guarding a job nobody finished.
story.bark.family.aberration.deep=Still nothing on file. I've stopped assuming that means it isn't ours.
story.bark.family.demon.deep=That wasn't an enemy. That was a body defending itself.
story.bark.family.golem.deep=The rock is standing up to stop us. I'd call that fair.

# First sight of an ARCHETYPE (one-shot per type): one behaviour each, the one that kills players.
story.bark.enemy.plague_hulk=Big one. Don't trade punches - shoot it while it's walking.
story.bark.enemy.eye_tyrant=It only fires straight down a row or a column. Step off its line.
story.bark.enemy.gore_biter=They come as a pack. Find a doorway and make them queue.
story.bark.enemy.shell_brute=It charges in a straight line. Step aside, then hit it while it recovers.
story.bark.enemy.mire_wraith=The acid stacks. Kill it first, argue later.
story.bark.enemy.iron_stalker=That's a step up. Spend something on it or walk around it.
story.bark.enemy.acid_drone=It keeps backing off. Corner it - it can't kite through a wall.
story.bark.enemy.void_shroud=It goes for your back. Turn and face it before it gets there.
story.bark.enemy.ghoul=Slow, and it never stops. Keep walking and never let it corner you.
story.bark.enemy.crawler=Fast, thin. Drop it now, before the rest arrive.
story.bark.enemy.revenant=Fast and heavy. Do not let that one reach you.
story.bark.enemy.vortex_eye=Short range only. Break its line or get right on top of it.
story.bark.enemy.blight_corruptor=Thick. Wear it down from range; don't stand in front of it.
story.bark.enemy.auric_sentinel=Those shards are its armour and its ammo. Strip them fast.
story.bark.enemy.cinderforge_colossus=It re-hardens the second you stop shooting. Don't stop shooting.
story.bark.enemy.rimeshell_lancer=Armoured until it fires. Bait the lance, step off the lane, then hit it.
story.bark.enemy.verdant_spiresower=The spires heal it. Break those first or it never dies.
story.bark.enemy.overseer=It telegraphs everything. Watch one full cycle before you commit.
story.bark.enemy.corruptor=It tells you what's coming before it does it. Learn that, then punish it.
story.bark.enemy.hell_baron=Timing, not reflexes. Read the mark, then move.

# First time a SPECIAL ABILITY resolves in front of the player: the rules you otherwise learn dying.
story.bark.ability.self_destruct=It's counting down to blow. Get two tiles clear or kill it now.
story.bark.ability.summon=It's calling more in. Kill the caller or you'll be here all day.
story.bark.ability.area_strike=That hits the whole cross, not just your tile. Get off the line.
story.bark.ability.buff_self=It just made itself harder. Whatever you were doing, do it faster.
story.bark.ability.debuff_player=That did something to you, not to your health. Check the bar.

# The first boss: one line walking in, one REVEAL on its death.
story.bark.boss.first=This one's on the plans. They built the room around it.
story.bark.boss.first.dead=They knew it was here. They built a door for it and sent shifts past anyway.

# --- Kills: rare, rate-limited, tone tracks the descent ---
story.bark.kill.rings.1=See? Contaminant. Nothing violence can't purge.
story.bark.kill.rings.3=Logged as hostile stock. That's the word they use.
story.bark.kill.rings.4=One down. I'd cheer, but I'm a professional.
story.bark.kill.rings.5=Down. I'd feel better if I knew what it used to be.
story.bark.kill.galleries.1=It screamed on the same note as the room. That's twice now.
story.bark.kill.galleries.2=Specimen neutralised. That word is working hard.
story.bark.kill.galleries.3=It stopped screaming before it stopped moving.
story.bark.kill.galleries.5=Harvest tag on its leg. It was inventory before it was a threat.
story.bark.kill.reliquary.1=It stopped moving. I keep waiting to feel better.
story.bark.kill.reliquary.2=That one had a serial. I won't read it out.
story.bark.kill.reliquary.3=A failed print. They made it, then left it in here.
story.bark.kill.reliquary.4=It came out of a Cradle. The same way you do.
story.bark.kill.wound.1=I logged that as a kill. It wasn't a hostile.
story.bark.kill.wound.2=I'm not calling that a purge. Not anymore.
story.bark.kill.wound.3=It only came at you because we are the wound.
story.bark.kill.wound.4=Immune response. That's all any of them ever were.

# --- Low health.  mid.2 is banded to the Reliquary and below (narrative-rework order-6 C): before
# the cradle beat she has not read what a print costs, so she cannot know it yet.  mid.3 is what
# keeps the Galleries band two rows deep after that move. ---
story.bark.lowhealth.rings.1=Ten percent and still walking at it. Bold. Dumb.
story.bark.lowhealth.rings.2=You're leaking. Patch that before I have to log it.
story.bark.lowhealth.mid.1=Careful. Please. I don't want to count you again.
story.bark.lowhealth.mid.2=Every reprint costs something. I know what now.
story.bark.lowhealth.mid.3=Back off and patch yourself up. I'll watch the corridor.
story.bark.lowhealth.deep.1=Stop. Please stop. I can't watch them print you again.
story.bark.lowhealth.deep.2=If you fall here, it pays for you. Don't make it.

# --- Deep strata: the planet, silent in Region 1, growing with the descent ---
story.bark.strata.galleries.1=...down...
story.bark.strata.galleries.2=...again...
story.bark.strata.galleries.3=...warm...
story.bark.strata.galleries.4=...still...
story.bark.strata.reliquary.1=There you are. New face. Same weight.
story.bark.strata.reliquary.2=You know what they burn to wake you? Me.
story.bark.strata.reliquary.3=A piece of me. Every time you die.
story.bark.strata.reliquary.4=You are not from the surface. You worked here.
story.bark.strata.reliquary.5=You smell the same. The suit is new.
story.bark.strata.reliquary.6=I know this weight. I have carried it before.
story.bark.strata.wound.1=You heard me screaming. No one else did.
story.bark.strata.wound.2=I could not tell your hands from theirs.
story.bark.strata.wound.3=They don't want me dead. Dead, I bleed nothing.
story.bark.strata.wound.4=They took part of you too. I kept it.

# --- Idle / backtracking: lowest-priority flavour ---
story.bark.idle.rings.1=Take your time. Whatever's down there has waited longer than us.
story.bark.idle.rings.2=I can wait. I'm contractually excellent at waiting.
story.bark.idle.mid.1=Standing still doesn't make it quieter. I checked.
story.bark.idle.mid.3=You've stopped. Fine by me. It's quieter when you're still.
story.bark.idle.deep.1=I don't like it when you stop moving down here.
story.bark.idle.deep.2=It's waiting too. That's the part I don't like.
story.bark.backtrack.rings.1=We've walked this one. I made a note. Twice now.
story.bark.backtrack.rings.2=Lost? Say nothing. I'll log it as a patrol route.
story.bark.backtrack.mid.1=Same corridor. Feels more occupied than last time.
story.bark.backtrack.mid.2=You cleared this. It doesn't feel cleared, does it.
story.bark.backtrack.deep.1=You keep circling. So does it.
story.bark.backtrack.deep.3=Circling. If you're looking for a way up, there isn't one.

# =====================================================================
# ORDER-3 BOOT / REPRINT CARD - the full-screen card shown on every reprint, and on the
# very first run too (in-fiction the original self has just died). Registered as data in
# narrative/BootCardCatalog; text mirrored in narrative/BootCardStrings.
#
# Two voices, two rules:
#  * SYSTEM lines are flat machine status and must each fit ONE panel line (40 chars) -
#    a wrapped status readout looks like a layout bug rather than like a cold terminal.
#    They never editorialize: the horror is entirely in what the player learns to read
#    into "SOUL RESERVE .......... SUFFICIENT" by run 40 (story/dialog/system-cards.md).
#  * ORA's wake lines are prose, wrap to at most 2 lines, and are region-gated - warm and
#    matter-of-fact up top, distracted in the Galleries, cracked in the Reliquary, protective
#    below.  She never scores the death on the screen that reports it (doctrine D6).
#    They may carry the {instance} token, replaced with the zero-padded reprint number.
# The endgame cards exist to SUBVERT the default one (story/06-endings.md); MERGE has no
# card at all, so it has no strings here. A test enforces every rule above.
# =====================================================================

# --- The button label ---
story.boot.continue=CONTINUE

# --- System card: THE FIRST PRINT (narrative-rework order-2 A/B). The first four lines of
# this fiction anybody ever reads, on the launch screen and then on the card. Not one proper
# noun of the setting between them: a person died, that person is you, there is a copy, the
# copy is being made. ---
story.boot.system.firstprint.1=OPERATOR ............. DECEASED
story.boot.system.firstprint.2=BODY RECOVERY ........ NOT POSSIBLE
story.boot.system.firstprint.3=BACKUP COPY .......... ON FILE
story.boot.system.firstprint.4=PRINTING NEW BODY .... STAND BY

# --- System card: the default reprint (every run after the first print) ---
story.boot.system.reprint.1=PREVIOUS BODY ........ DECEASED
story.boot.system.reprint.2=BACKUP COPY .......... ON FILE
story.boot.system.reprint.3=PRINTING NEW BODY .... STAND BY

# --- System card: the same reprint from the Harvesting Galleries down, where ORA has started
# asking what the printers run on. SOUL RESERVE is a Region-3 reveal and is not printed before
# this band - it was wallpaper on screen one and is horrifying here (order-2 C). ---
story.boot.system.reprint.deep.1=PREVIOUS BODY ........ DECEASED
story.boot.system.reprint.deep.2=SOUL RESERVE ......... SUFFICIENT
story.boot.system.reprint.deep.3=PRINTING NEW BODY .... STAND BY

# --- System card: FREE IT - the reserve bought the being's freedom; nothing reloads ---
story.boot.system.free.1=PREVIOUS INSTANCE - TERMINATED
story.boot.system.free.2=SOUL RESERVE .......... DEPLETED
story.boot.system.free.3=NO CHECKPOINT AUTHORIZED FOR REPRINT

# --- System card: KILL IT - the same absence, by the other road ---
story.boot.system.kill.1=PREVIOUS INSTANCE - TERMINATED
story.boot.system.kill.2=PATTERN SOURCE ........ UNRECOVERABLE
story.boot.system.kill.3=NO CHECKPOINT AUTHORIZED FOR REPRINT

# --- System card: OBEY - a promotion. The reward is more of the same, forever ---
story.boot.system.obey.1=INSTANCE - RETAINED
story.boot.system.obey.2=REPRINT PRIORITY ...... RAISED
story.boot.system.obey.3=STANDING ASSIGNMENT: EREBUS, INDEFINITE

# --- RESERVED wake lines (narrative-rework order-2 B/C): held for the three cards a player
# only ever reads once. The first print (she does not lead with a name, thirty seconds after a
# death notice), and their first real deaths, where the loop gets EXPLAINED rather than joked
# about - plus, one print later, the REPORT plate, because a plate nobody taps is a page
# nobody reads. Reserved by instance number, so they land in order, once each. ---
story.boot.wake.first.1=Easy. Give the eyes a second. I'm right here.
story.boot.wake.firstdeath.1=You died. It's alright. That's what the copy is for.
story.boot.wake.firstdeath.2=Nothing you were carrying came back. You did. Again.
story.boot.wake.firstdeath.report=There's a REPORT plate if you want to see what got you.

# --- RESERVED wake lines: THE COUNTER MILESTONES (narrative-rework order-9 D). Every tenth print,
# one line about the number itself. It starts as a joke about round numbers and ends as the thing
# she will not say out loud - the same gag, told six times across a hundred deaths, arriving
# somewhere else each time. Banded from thirty down, because the turn only means anything to
# somebody who has read what the Cradles are fed. ---
story.boot.wake.milestone.10=Print ten. Round numbers. I'd get you a cake.
story.boot.wake.milestone.20=Print twenty. You've been at this a while now.
story.boot.wake.milestone.30=Print thirty. I've stopped rounding it off in my head.
story.boot.wake.milestone.40=Print forty. I know what that is now. I'd rather not say it.
story.boot.wake.milestone.50=Fifty. I keep the number because somebody should.
story.boot.wake.milestone.100=A hundred. I'm not going to pretend that's nothing.

# --- RESERVED wake lines: THE RE-ENTRY LINE (narrative-rework order-9 A). One sentence to a player
# who has been away longer than STORY_REENTRY_GAP_HOURS, taking this card's single ORA slot instead
# of a greeting: where they are, and what they were last told. NEVER what to do next - the moment
# one of these acquires an objective it is a quest log wearing her voice. ---
story.boot.wake.reentry.rings=You're back at the rings. Same job: down, find it, restart the works.
story.boot.wake.reentry.galleries=We were in the cutting floors. Working out what they were cutting.
story.boot.wake.reentry.reliquary=The Reliquary. We'd just found out what the printers run on.
story.boot.wake.reentry.wound=We were in the warm part. Where it stops being a facility.
story.boot.wake.reentry.core=The Core. You know what's down there now. Whenever you're ready.

# --- ORA's wake-up line, Region 1: warm and matter-of-fact.  She reads the number out and checks
# the body over; she never scores the death and never celebrates it (narrative-rework order-6 C,
# doctrine D6).  The counter still climbs - it just stops cheering. ---
story.boot.wake.rings.1=Morning. Print {instance}. All limbs where they should be.
story.boot.wake.rings.2=You're up. Print {instance}. Feed lines are clear.
story.boot.wake.rings.3=Back on your feet. I logged that one as a stumble.
story.boot.wake.rings.4=Print {instance}. Same as the last one, near enough.

# --- Region 2: distracted; she has started asking what the printers run on ---
story.boot.wake.galleries.1=Reprint {instance}. Hey - what do the printers run on?
story.boot.wake.galleries.2=You're awake. The reserve ticked down again. Odd.
story.boot.wake.galleries.3=Print {instance}. The line item says 'yield'. Of what?
story.boot.wake.galleries.4=Up you get. I asked about the reserve. Nobody answered.

# --- Region 3: cracking; she knows what the Cradles are fed ---
story.boot.wake.reliquary.1=Reprint {instance}. That's {instance} pieces of something alive.
story.boot.wake.reliquary.2=You're awake. I'm not counting for fun anymore.
story.boot.wake.reliquary.3=Print {instance}. I read what the Cradles are fed. Sorry.
story.boot.wake.reliquary.4=Back again. Something down there paid for that.

# --- Region 4: quiet, protective; she keeps things off the log for you ---
story.boot.wake.wound.1=You're awake. I didn't tell them what you found.
story.boot.wake.wound.2=Print {instance}. I left it out of the log. All of it.
story.boot.wake.wound.3=You're up. It goes quiet every time you die.
story.boot.wake.wound.4=Back. I've stopped filing these. Let them ask.

# --- Region 5: the Core; nothing left to hedge ---
story.boot.wake.core.1=You're awake. Last one, I think. Either way, I'm here.
story.boot.wake.core.2=Print {instance}. Whatever you choose down here, I'm with you.
story.boot.wake.core.3=You're up. They can't reprint this part of me out.

# =====================================================================
# ORDER-4 - INTERACTIVE EXCHANGES (blocking; the player answers)
# Prompts and replies are prose (max 3 wrapped lines).  ANSWERS are one short line each and must
# stay distinct at a glance - three shades of "yes" is the same as having no choice at all.
# The Organization's prompts are upper-cased at delivery; keep them sentence case here.
# =====================================================================
story.exchange.continue=CONTINUE

# --- Region 1: THE BRIEFING (order-7). The gate order gave the job; this gives the reason, and
# plants the three claims the descent disproves in a room, with an object ---
story.exchange.rings.briefing.prompt=Operator. The contaminant killed them and came up from the lower works. Locate it.
story.exchange.rings.briefing.obey=Understood. Going down.
story.exchange.rings.briefing.obey.reply=That's the spirit. I'll log it as enthusiasm.
story.exchange.rings.briefing.doubt=Contaminant. Odd word for it.
story.exchange.rings.briefing.doubt.reply=It's the word on the form. I didn't write the form.
story.exchange.rings.briefing.probe=Why me?
story.exchange.rings.briefing.probe.reply=You are the operator on file. You have made this descent before.

# --- Region 1: the teaching exchange. The first choice ever offered, and it decides nothing on
# purpose: the player learns the layer with no enemy awake and nothing at stake.  It is now ABOUT
# something they were told sixty seconds earlier - the memory gap - so answering is a thought rather
# than a mood check (narrative-rework order-6 E). ---
story.exchange.rings.teaching.prompt=While it's quiet - do you actually remember doing this before? Because your file says you have.
story.exchange.rings.teaching.some=Some of it.
story.exchange.rings.teaching.some.reply=That's more than the last one gave me. Hold onto it.
story.exchange.rings.teaching.none=None of it.
story.exchange.rings.teaching.none.reply=That's the usual answer. I keep asking anyway.
story.exchange.rings.teaching.matter=Does it matter?
story.exchange.rings.teaching.matter.reply=Not to the job, no. It matters to me.

# --- Region 2: the mandatory first-doubt beat, said before the first floor of it ---
story.exchange.galleries.arrival.prompt=These floors were built for cutting things up, not for keeping anyone out. Does that land wrong for you too?
story.exchange.galleries.arrival.work=It's a job site.
story.exchange.galleries.arrival.work.reply=A job site with drainage. Sure.
story.exchange.galleries.arrival.wrong=It lands wrong.
story.exchange.galleries.arrival.wrong.reply=Thank you. I thought it was a fault in me.
story.exchange.galleries.arrival.what=What were they cutting?
story.exchange.galleries.arrival.what.reply=Tissue. The manifests all say tissue. None say whose.

# --- Region 2: the Organization, corrective. Fires a floor AFTER the gate, never on it ---
story.exchange.galleries.demand.prompt=Operator. Your feed carries auditory artifacts. They originate in you. Acknowledge.
story.exchange.galleries.demand.acknowledge=Acknowledged.
story.exchange.galleries.demand.acknowledge.reply=Corrected. Continue the descent.
story.exchange.galleries.demand.push=Your own sensors have it.
story.exchange.galleries.demand.push.reply=No reply. It's on my log too. I didn't flag it either.
story.exchange.galleries.demand.silence=(say nothing)
story.exchange.galleries.demand.silence.reply=Non-response recorded. The fault is noted as ongoing.

# --- Region 2: ORA's first doubt, and the cache that pays for looking ---
story.exchange.galleries.ledger.prompt=The yield sheets bother me. Something here was weighed by the tonne. Want it?
story.exchange.galleries.ledger.read=Read it to me.
story.exchange.galleries.ledger.read.reply=Four tonnes a shift. And a supply code. Take the kit.
story.exchange.galleries.ledger.later=Not now.
story.exchange.galleries.ledger.later.reply=Sure. Filed under 'later'. With the rest.
story.exchange.galleries.ledger.what=Does it say what it is?
story.exchange.galleries.ledger.what.reply=It says 'yield'. Twelve times. Not once what.

# --- Region 3: the planet's first real exchange. It knows you by deed, not by serial ---
story.exchange.reliquary.address.prompt=there you are. new face. same weight.
story.exchange.reliquary.address.who=Who are you?
story.exchange.reliquary.address.who.reply=the ground. the thing under the ground. the thing they weigh.
story.exchange.reliquary.address.out=Stay out of my head.
story.exchange.reliquary.address.out.reply=i am not in your head. i am under your feet. i grieve anyway.
story.exchange.reliquary.address.know=...I know you.
story.exchange.reliquary.address.know.reply=yes. you did this. and you came back. both are true.

# --- Region 3: the trust beat; she wrote it down and it can get her wiped ---
story.exchange.reliquary.log.prompt=That terminal told me what the reserve is. It's in my log now. They read my log.
story.exchange.reliquary.log.delete=Delete it. Stay safe.
story.exchange.reliquary.log.delete.reply=Gone. It never happened. Thank you.
story.exchange.reliquary.log.keep=Leave it. Let them read it.
story.exchange.reliquary.log.keep.reply=Then they'll know I know. All right.
story.exchange.reliquary.log.ask=Say it out loud first.
story.exchange.reliquary.log.ask.reply=It's them. Every print of you burns a piece of one.
story.exchange.reliquary.decide.prompt=So. The log. Do I keep it, or does it never exist?
story.exchange.reliquary.decide.delete=Delete it.
story.exchange.reliquary.decide.keep=Keep it.

# --- Region 4: the planet, addressing you. Denial is a real answer ---
story.exchange.wound.voice.prompt=not a thing. me. you knew. you always knew.
story.exchange.wound.voice.accept=I know.
story.exchange.wound.voice.accept.reply=then stop. or come down. either.
story.exchange.wound.voice.deny=You're not real.
story.exchange.wound.voice.deny.reply=It's on my sensors too. So. It's real.
story.exchange.wound.voice.probe=Who were you?
story.exchange.wound.voice.probe.reply=before the drills. before your word for me.

# --- Region 4: the Organization, coercive. The mask is off ---
story.exchange.wound.coercion.prompt=Operator. Restore the restraints or your pattern is written off. There is no next body.
story.exchange.wound.coercion.comply=Understood.
story.exchange.wound.coercion.comply.reply=Authorization held. Pending completion.
story.exchange.wound.coercion.refuse=Then write it off.
story.exchange.wound.coercion.refuse.reply=That's on the open channel. I'm leaving it there.
story.exchange.wound.coercion.who=Who signs that?
story.exchange.wound.coercion.who.reply=Nobody signs it. It's a threshold. It just trips.

# --- Region 5: the last order, asked before the endings ---
story.exchange.core.order.prompt=Operator. Final descent. Restraints are to be restored. Confirm.
story.exchange.core.order.confirm=Confirmed.
story.exchange.core.order.confirm.reply=Logged. Proceed to the core.
story.exchange.core.order.refuse=No.
story.exchange.core.order.refuse.reply=Repeat your last, operator.
story.exchange.core.order.probe=Who is actually speaking?
story.exchange.core.order.probe.reply=Nobody. The routing headers change every transmission. The phrasing never does. It's a desk.

# --- Region 5: THE ENDING (story/06-endings.md). A door with three equally-weighted ways
# out; each one opens a confirmation that states its price in one plain line, and every
# confirmation has a way back. Nothing is labelled good or bad and nothing is recommended ---
story.exchange.core.ending.prompt=you remember it all now. the door you opened. my hand. so. choose.
story.exchange.core.ending.unmake=Break the drills.
story.exchange.core.ending.obey=Put the restraints back.
story.exchange.core.ending.merge=Stop being separate.
story.exchange.core.ending.unmake.prompt=Cut the drills and the reserve is gone. Nobody prints again. Not you, not me. Awake, or asleep?
story.exchange.core.ending.unmake.free=Let it wake.
story.exchange.core.ending.unmake.free.reply=oh. oh. go, then. be finished. thank you.
story.exchange.core.ending.unmake.kill=Let it rest.
story.exchange.core.ending.unmake.kill.reply=yes. quiet. i had forgotten quiet.
story.exchange.core.ending.unmake.wait=Not yet.
story.exchange.core.ending.obey.prompt=Restraints back on means it stays alive and awake for it. Forever. And you keep printing.
story.exchange.core.ending.obey.commit=Do it.
story.exchange.core.ending.obey.commit.reply=Compliance logged. Reprint priority raised.
story.exchange.core.ending.obey.wait=Not yet.
story.exchange.core.ending.merge.prompt=if you come in there is no coming out. there is no you to come out. still?
story.exchange.core.ending.merge.commit=Let go.
story.exchange.core.ending.merge.commit.reply=be still. this is the only part that never hurt.
story.exchange.core.ending.merge.wait=Not yet.

# --- Deep-strata check-ins: the warm one and the neutral one anybody can get.  The third row (the
# Organization-leaning "ahead of schedule" status check) was CUT by narrative-rework order-6 B: it
# floated free of any region beat, it blocked play to say nothing, and there is no schedule to be
# ahead of in an endless descent.  A player leaning that way now gets the neutral row. ---
story.exchange.deep.warm.prompt=Quiet stretch. Can I ask you something that isn't work?
story.exchange.deep.warm.listen=Go ahead.
story.exchange.deep.warm.listen.reply=Do you remember the last one? Before you. I do.
story.exchange.deep.warm.work=Not now, ORA.
story.exchange.deep.warm.work.reply=Right. Work. Copy that.
story.exchange.deep.quiet.prompt=Two floors since anything moved. Not normal at this depth.
story.exchange.deep.quiet.good=Good.
story.exchange.deep.quiet.good.reply=Sure. Good. I'll keep watching anyway.
story.exchange.deep.quiet.waiting=Something's waiting.
story.exchange.deep.quiet.waiting.reply=That was my read too. I didn't want to say it.

# =====================================================================
# ORDER-6 CODEX COMPLETION - ORA noticing that a shelf of the archive is full.
# That is the WHOLE completion perk: warm, one line, one-shot per category, and never a
# gameplay bonus. Paying completion in power would turn an opt-in archive into a grind.
# =====================================================================
story.bark.codex.complete.logs=You read all the paperwork. Every page. Wow.
story.bark.codex.complete.people=You know all their names now. Somebody should.
story.bark.codex.complete.planet=That's everything it's managed to tell us.
story.bark.codex.complete.organization=The whole file on them. It's worse assembled.
story.bark.codex.complete.ora=You looked me up. All of it. Thank you, actually.
story.bark.codex.complete.memories=That's all of you I could get back. It's enough.

# --- What the map is (narrative-rework order-8, HOLE 2) ---------------------
story.bark.map.rings=Nobody built one way down. They built dozens, and kept digging.
story.bark.map.galleries=The routes follow the cutting faces. That's why they branch.
story.bark.map.reliquary=Every road down here ends at the same racks.
story.bark.map.wound=These aren't corridors now. We're picking which part to walk through.
story.bark.map.core=It's all one room down here. The map is being polite.

# --- THE GRIND FLOORS (narrative-rework order-9 D) --------------------------
# The only small talk in the game. These fire on ground the SAVE has already covered, where every
# one-shot beat was spent runs ago and the layer would otherwise be silent for whole sessions.
# No line here claims a fact about the run's state - she is software in a suit, not a spectator
# with a view of the bag, and a companion who is wrong about the player half the time is worse
# than one who says nothing. The region band still carries the whole arc.
story.bark.depth.rings.1=Another one of these. I'll say if it stops being one.
story.bark.depth.rings.2=We've done this stretch. I'll try to look surprised.
story.bark.depth.rings.3=Keep going. It's the only direction the building offers.
story.bark.depth.rings.4=Nothing to report. I'm reporting that.
story.bark.depth.galleries.1=I've been back through the manifests. Don't wait for me.
story.bark.depth.galleries.2=Go on ahead. I'm counting something and keep losing it.
story.bark.depth.galleries.3=Nothing new on this floor. Just the same question.
story.bark.depth.galleries.4=I start sentences down here and don't finish them. Sorry.
story.bark.depth.reliquary.1=You've walked this one. I remember it better than you do.
story.bark.depth.reliquary.2=Talk to me on this stretch. I'd rather you did.
story.bark.depth.reliquary.3=I know this floor. Knowing it hasn't helped yet.
story.bark.depth.reliquary.4=I'd make a joke here. I've run out of the good ones.
story.bark.depth.wound.1=Old ground. I'm watching it anyway.
story.bark.depth.wound.2=I'd say be careful. You'd ignore me. Be careful.
story.bark.depth.wound.3=You've been here. It hasn't forgotten that either.
story.bark.depth.wound.4=No news. I'll take no news.
story.bark.depth.core.1=You know this floor. Take it slowly anyway.
story.bark.depth.core.2=We could stop. We won't. I know.
story.bark.depth.core.3=Nothing down here is new to us now. Keep moving.
story.bark.depth.core.4=Still with you. In case that was in question.

