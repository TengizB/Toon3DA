[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "de.golfgl.gdxcontrollerutils:gdx-controllerutils-scene2d:$controllerScene2DVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  // Headless unit testing (JUnit 5). Used by the route-map subsystem tests, which run without a
  // LibGDX render context.
  testImplementation platform("org.junit:junit-bom:5.10.2")
  testImplementation "org.junit.jupiter:junit-jupiter"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// FAST GATE — every commit. Runs the whole schema audit (orders 1-8) plus the ordinary unit tests,
// and EXCLUDES the order-9 behavioural bands, which play thousands of simulated turns.
test {
  useJUnitPlatform {
    excludeTags 'balanceSim'
  }
}

// SLOW GATE — `./gradlew balanceSim`, run on balance changes and nightly in CI. Plays whole runs
// through the real systems and checks the six behavioural bands (new-game-balancr order 9). Writes a
// plain-text summary to core/build/reports/balance-sim/summary.txt.
tasks.register('balanceSim', Test) {
  description = 'Plays the balance simulation matrix and checks the behavioural bands (order 9).'
  group       = 'verification'
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath       = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeTags 'balanceSim'
  }
  // Whole simulated runs are memory-light but CPU-hungry; the matrix parallelises internally.
  maxHeapSize = '2g'
  testLogging {
    showStandardStreams = true
    events 'passed', 'failed', 'skipped'
  }
  outputs.upToDateWhen { false }   // a simulation gate must actually run when asked
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
